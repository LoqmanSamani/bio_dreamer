# ProteinDreamer — Default Configuration
#
# Each top-level section maps 1-to-1 to the config dict consumed by the
# corresponding class:
#
#   data          →  ProteinGymDataset / TsuboyamaDataset / CustomAssayDataset
#   dataloader    →  make_dataloaders()
#   tokenizer     →  ProteinTokenizer
#   encoder       →  ProteinEncoder
#   action_encoder→  ActionEncoder
#   dynamics      →  EnergyBasedDynamics | DiffusionDynamics
#   decoder       →  ProteinDecoder / ProteinBlockDecoder
#   reward        →  ProteinRewardHead
#   policy        →  ProteinActiveInferencePolicy
#   uncertainty   →  EnsembleUncertainty | EvidentialUncertainty | MCDropoutUncertainty
#   environment   →  ProteinEnvironment
#   training      →  WorldModelTrainer / PolicyTrainer (includes SIGReg + EMAUpdater)
#   active_learning→ ActiveLearner
#   logging       →  callbacks / W&B
#   gvp           →  GVP (standalone fallback defaults)
#   gvp_conv      →  GVPConv (standalone fallback defaults)
#   gvp_gnn       →  GvpGNN (standalone fallback defaults)
#   gvp_transformer→ GraphTransformer / GraphTransformerLayer (standalone fallback defaults)
#   residual_mlp  →  ResidualMLP
#
# Keys marked (*required*) have no default in the class — they must be present.
# Keys marked (*shared*) appear in multiple sections; keep them in sync.
#
# Load with:
#   from biodreamer.protein_dreamer.config import ProteinDreamerConfig
#   cfg = ProteinDreamerConfig.default()
#   encoder = ProteinEncoder(cfg["encoder"])


# ─────────────────────────────────────────────────────────────────────────────
# Data  (ProteinGymDataset / TsuboyamaDataset / CustomAssayDataset)
# ─────────────────────────────────────────────────────────────────────────────
data:
  # Paths to raw data directories (used by download.py and training scripts)
  proteingym_dir:  "data/proteingym"
  tsuboyama_dir:   "data/tsuboyama"

  # ProteinGymDataset / TsuboyamaDataset hyperparameters
  max_length:       null   # truncate sequences at this length (null = no truncation)
  return_tensors:   false  # return torch tensors from tokenizer (false = lists)
  strict_wt_check:  true   # raise if mutant sequence doesn't match WT at expected positions
  load_structures:  false  # load ESMFold Cα coordinates per sample (slow; needs ESMFold)
  struct_cache_dir: null   # where to cache / read structure predictions (null = temp dir)
  tokenizer_mode:   "char" # internal tokenizer mode for mutation encoding: "char" | "kmer" | "bpe"
  pretokenize:      true   # tokenize all sequences at init (faster training, more RAM)

  # CustomAssayDataset column name overrides
  seq_col:     "sequence"  # column containing amino acid sequence strings
  fitness_col: "fitness"   # column containing fitness / score values


# ─────────────────────────────────────────────────────────────────────────────
# Preprocessing  (tokenize_sequence / load_structure / build_protein_graph /
#                 normalize_fitness / augment_dms_data)
# ─────────────────────────────────────────────────────────────────────────────
preprocessing:
  tokenizer_model:  "esm2-150m"  # HF model used by tokenize_sequence (matches encoder default)
  return_tensors:   false         # return torch tensors from tokenize_sequence
  padding:          true          # pad sequences in tokenize_sequence
  truncation:       true          # truncate sequences exceeding the model max length
  coord_mode:       "ca"          # coordinate extraction: "ca" | "backbone" | "all_atom"
  struct_cache_dir: null          # ESMFold prediction cache dir (null = ~/.cache/biodreamer/structures)
  contact_cutoff:   10.0          # Cα contact distance threshold in Å for build_protein_graph
  fitness_norm:     "quantile"    # fitness normalisation method: "minmax" | "zscore" | "quantile"
  augmentation:     "none"        # DMS data augmentation strategy: "none" | "reverse"


# ─────────────────────────────────────────────────────────────────────────────
# DataLoader  (make_dataloaders)
# ─────────────────────────────────────────────────────────────────────────────
dataloader:
  batch_size:      64
  val_batch_size:  128
  test_batch_size: 128
  num_workers:     4
  pin_memory:      true
  train_shuffle:   true
  val_shuffle:     false
  test_shuffle:    false


# ─────────────────────────────────────────────────────────────────────────────
# Tokenizer  (ProteinTokenizer)
# ─────────────────────────────────────────────────────────────────────────────
tokenizer:
  mode:               "char"   # "char" | "kmer" | "bpe"
  k:                  3        # k-mer size (only used when mode="kmer")
  stride:             null     # k-mer stride (null = non-overlapping)
  bpe_vocab_size:     200      # BPE vocabulary target size (only when mode="bpe")
  bpe_merges:         null     # pre-trained BPE merge table (null = train from scratch)
  organism_tokens:    null     # list of organism-specific special tokens, e.g. ["[ORG_HUMAN]"]
  add_special_tokens: true     # prepend [CLS] / append [EOS]
  include_ambiguous:  true     # include ambiguous amino acid codes (B, Z, X, U)


# ─────────────────────────────────────────────────────────────────────────────
# Encoder  (ProteinEncoder)
# ─────────────────────────────────────────────────────────────────────────────
encoder:
  latent_dim:            256         # (*shared*) output z_t dimension
  seq_model_name:        "esm2-650m" # "esm2-8m" | "esm2-35m" | "esm2-150m" | "esm2-650m" | "esm2-3b"
  freeze_seq_encoder:    true        # freeze ESM-2 weights (recommended for limited GPU)
  freeze_struct_encoder: true        # freeze GVP-GNN weights
  use_structure:         false       # enable GVP-GNN structure branch (requires ESMFold coords)

  # GVP-GNN structure encoder sub-config (only used when use_structure=true)
  gvp_gnn:
    in_node_dims: [4, 0]    # input scalar and vector node dimensions (4 = [x,y,z,pLDDT])
    in_edge_dims: [1, 0]    # input scalar and vector edge dimensions (1 = distance)
    hidden_dims:  [256, 4]  # hidden scalar and vector dimensions
    n_layers:     3
    vector_dim:   3
    conv_type:    "gvp"
    n_heads:      4
    dropout:      0.1


# ─────────────────────────────────────────────────────────────────────────────
# Action Encoder  (ActionEncoder)
# ─────────────────────────────────────────────────────────────────────────────
action_encoder:
  latent_dim: 256   # (*shared*) output action vector dim — must match dynamics.action_dim
  embed_dim:  256   # internal embedding dim for position / amino acid tokens


# ─────────────────────────────────────────────────────────────────────────────
# Dynamics  (EnergyBasedDynamics | DiffusionDynamics)
# ─────────────────────────────────────────────────────────────────────────────
dynamics:
  arch:       "energy_based" # which architecture to instantiate: "energy_based" | "diffusion"
  latent_dim: 256            # (*shared*) must match encoder.latent_dim
  action_dim: 256            # must match action_encoder.latent_dim

  # EnergyBasedDynamics (DeterministicPredictor)
  transformer:
    dim:       256  # (*shared*) must match encoder.latent_dim
    n_layers:  6
    n_heads:   8
    mlp_ratio: 4.0
    dropout:   0.1
    max_len:   1024
    causal:    false  # false = bidirectional (JEPA predictor); true = autoregressive
    time_emb_dim: 256

  # DiffusionDynamics — DDPM Scheduler
  ddpm:
    time_steps:    1000
    schedule_type: "cosine"      # noise schedule: "linear" | "cosine"
    pred_type:     "noise"       # "noise" | "x0" | "v"
    var_type:      "fixed_small" # "fixed_small" | "fixed_large" | "learned"
    beta_min:      0.0001
    beta_max:      0.02
    cosine_s:      0.008
    clip_min:      0.0001
    clip_max:      0.9999
    clip_out:      true
    valid_types:     ["noise", "x0", "v"]      # for sanity-checking config values
    valid_schedules: ["linear", "cosine"]       # for sanity-checking config values

    # Auto-built DiffTransformer denoiser (used when no denoiser is injected)
    denoiser:
      n_layers:  4
      n_heads:   8
      mlp_ratio: 4.0
      dropout:   0.1

  # SDE scheduler
  sde:
    method:          "ode"     # "vp" | "ve" | "sub-vp" | "ode"
    pred_type:       "v"       # "noise" | "score" | "v"
    schedule_type:   "cosine"  # "linear" | "cosine"
    beta_min:        0.1
    beta_max:        20.0
    time_eps:        1.0e-5
    num_steps:       400
    sigma_min:       0.01      # only for method="ve"
    sigma_max:       50.0      # only for method="ve"
    cosine_s:        0.008     # only for schedule_type="cosine"
    eps:             1.0e-8    # numerical stability constant for score-based sampling
    valid_methods:   ["vp", "ve", "sub-vp", "ode"]  # for sanity-checking config values
    valid_types:     ["noise", "score", "v"]          # for sanity-checking config values
    valid_schedules: ["linear", "cosine"]             # for sanity-checking config values

  # Flow matching scheduler
  flow_matching:
    num_steps:    100
    solver:       "heun"        # "euler" | "heun"
    time_eps:     1.0e-3
    valid_solvers: ["euler", "heun"]  # for sanity-checking config values


# ─────────────────────────────────────────────────────────────────────────────
# GVP building blocks — standalone fallback defaults
# These are used when GVP / GVPConv / GvpGNN / GraphTransformer are
# instantiated without an explicit config argument.
# ─────────────────────────────────────────────────────────────────────────────
gvp:
  in_node_dims:  [16, 4]  
  out_node_dims: [256, 4]   
  vector_dim:    3
  dropout:       0.1
  use_layernorm: false
  eps:           1.0e-8

gvp_conv:
  node_dims:    [256, 4]
  edge_dims:    [256, 4]
  message_dims: [256, 4]
  vector_dim:   3

gvp_gnn:
  in_node_dims: [16, 4]
  in_edge_dims: [16, 4]
  hidden_dims:  [256, 4]
  n_layers:     3
  vector_dim:   3
  conv_type:    "gvp"
  n_heads:      4
  dropout:      0.1

gvp_transformer:
  node_dims:  [256, 4]
  edge_dims:  [256, 4]
  hidden_dim: 256
  n_heads:    4
  dropout:    0.1
  vector_dim: 3
  n_layers:   3


# ─────────────────────────────────────────────────────────────────────────────
# ResidualMLP  (used in EnergyBasedDynamics and DiffTransformer blocks)
# ─────────────────────────────────────────────────────────────────────────────
residual_mlp:
  in_dim:     256   # must match encoder.latent_dim for dynamics
  hidden_dim: 512   # mlp hidden width
  out_dim:    256   # must match encoder.latent_dim for dynamics
  n_layers:   2
  dropout:    0.1


# ─────────────────────────────────────────────────────────────────────────────
# Decoder, sequence and structure  (ProteinSequenceDecoder / ProteinStructureDecoder)
# ─────────────────────────────────────────────────────────────────────────────
decoder:
  latent_dim:      256  # (*shared*) must match encoder.latent_dim
  n_layers:        4
  n_heads:         8
  mlp_ratio:       4.0
  dropout:         0.1
  max_seq_len:     1024  # maximum generated sequence length
  default_seq_len: 100   # sequence length used when length is not inferred from the latent


# ─────────────────────────────────────────────────────────────────────────────
# Reward  (ProteinRewardHead)
# ─────────────────────────────────────────────────────────────────────────────
reward:
  latent_dim: 256   # (*shared*) must match encoder.latent_dim
  hidden_dim: 512   # MLP hidden width

  # Loss weights for the four reward heads (NaN-masked during training)
  weights:
    stability: 0.35   # ΔΔG / ΔG folding measurements (Tsuboyama, ProteinGym stability)
    affinity:  0.25   # binding affinity / Kd (ProteinGym binding assays)
    activity:  0.20   # catalytic activity / kcat (ProteinGym activity assays)
    fitness:   0.20   # organismal / holistic fitness (catch-all head)


# ─────────────────────────────────────────────────────────────────────────────
# Policy  (ProteinActiveInferencePolicy)
# ─────────────────────────────────────────────────────────────────────────────
policy:
  latent_dim:           256   # (*shared*) must match encoder.latent_dim
  action_dim:           256   # must match action_encoder.latent_dim
  n_aa:                 20    # number of amino acid choices per site
  eta:                  1.0   # epistemic value weight in EFE (higher = more exploration)
  n_samples:            20    # Monte Carlo rollouts for uncertainty / EFE estimation
  imagination_horizon:  10     # steps of imagined planning per decision


# ─────────────────────────────────────────────────────────────────────────────
# Uncertainty  (EnsembleUncertainty | EvidentialUncertainty | MCDropoutUncertainty)
# ─────────────────────────────────────────────────────────────────────────────
uncertainty:
  type: "ensemble"   # which estimator to use: "ensemble" | "evidential" | "mc_dropout"

  # EvidentialUncertainty (*required* keys for this type)
  input_dim:  256    # (*required*) must match encoder.latent_dim
  output_dim: 1      # number of prediction targets
  hidden_dim: 256    # MLP hidden width

  # EnsembleUncertainty
  ensemble_size: 5    # number of ensemble members

  # MCDropoutUncertainty
  mc_dropout_passes: 20   # forward passes with dropout active at inference


# ─────────────────────────────────────────────────────────────────────────────
# Environment  (ProteinEnvironment)
# ─────────────────────────────────────────────────────────────────────────────
environment:
  max_steps:         50      # max mutation steps per episode
  fitness_threshold: null    # stop early if fitness exceeds this value (null = never)
  track_trajectory:  false   # store full sequence trajectory in episode info dict


# ─────────────────────────────────────────────────────────────────────────────
# Training  (WorldModelTrainer / PolicyTrainer)
# ─────────────────────────────────────────────────────────────────────────────
training:
  batch_size:    64
  lr:            3.0e-4
  weight_decay:  1.0e-4
  warmup_steps:  1000
  max_steps:     100000
  grad_clip:     1.0          # max gradient norm (0 = disabled)
  beta_dyn:      1.0          # dynamics loss weight (L_B or L_A)
  beta_rew:      0.1          # reward prediction loss weight
  device:        "cpu"        # "cuda" | "cpu"

  # SIGReg (latent space regulariser, class SIGReg in utils.py)
  sig_reg:
    latent_dim:   256   # (*shared*) must match encoder.latent_dim
    num_proj:     1024    # number of random 1D projections
    mean_weight:  1.0   # weight on the mean-centering term
    var_weight:   1.0   # weight on the variance-normalisation term
    proj_weight:  1.0   # weight on the random-projection uniformity term
    eps:          1.0e-6

  # EMAUpdater (target encoder momentum, class EMAUpdater in utils.py)
  ema:
    tau: 0.99   # EMA decay: target ← τ·target + (1-τ)·online  (must be in (0, 1))


# ─────────────────────────────────────────────────────────────────────────────
# Active Learning  (ActiveLearner)
# ─────────────────────────────────────────────────────────────────────────────
active_learning:
  acquisition:           "ucb"  # "ucb" | "greedy" | "thompson"
  rounds:                10     # number of active learning rounds
  candidates_per_round:  96     # sequences to score per round
  oracle_budget:         960    # total oracle (wet-lab) evaluations


# ─────────────────────────────────────────────────────────────────────────────
# Logging  (W&B callbacks, checkpointing)
# ─────────────────────────────────────────────────────────────────────────────
logging:
  wandb_project:    "protein-dreamer"
  checkpoint_freq:  1000   # steps between checkpoint saves
  eval_freq:        500    # steps between validation evaluations
