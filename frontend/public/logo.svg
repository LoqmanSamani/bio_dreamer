<svg width="1024" height="1024" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 2: Dream bubble + double helix -->
  <defs>
    <linearGradient id="s1" x1="14" y1="28" x2="50" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="s2" x1="14" y1="28" x2="50" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Thought bubble (main circle) -->
  <circle cx="32" cy="28" r="22" stroke="#6366f1" stroke-width="2.8" stroke-opacity="0.35" fill="#6366f1" fill-opacity="0.04" />

  <!-- Small bubble dots (thought trail) -->
  <circle cx="16" cy="56" r="3.5" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25" />
  <circle cx="22" cy="49" r="5.5" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.8" stroke-opacity="0.25" />

  <!-- Double helix strands -->
  <path d="M 14 28 C 20 14, 26 14, 32 28 C 38 42, 44 42, 50 28"
        stroke="url(#s1)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Strand 2 (indigo) — anti-phase -->
  <path d="M 14 28 C 20 42, 26 42, 32 28 C 38 14, 44 14, 50 28"
        stroke="url(#s2)" stroke-width="3.5" stroke-linecap="round" fill="none" />
</svg>
